# ==============================================================================
# Lenny Growth Assistant - Frontend Nginx Production Configuration
#
# Serves Vite production build and reverse-proxies /api/ requests to FastAPI backend.
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for static production bundle
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # SPA routing: fallback all non-file route queries to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for local LLM inference (e.g. Ship 30 essays on CPU/GPU)
        proxy_connect_timeout 60s;
        proxy_send_timeout 960s;
        proxy_read_timeout 960s;

        # Disable buffering to stream responses quickly
        proxy_buffering off;
    }

    # Fast 404 for missing static assets without falling back to index.html
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6h;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
